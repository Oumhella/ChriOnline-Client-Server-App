services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-prod
    restart: always
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - SKIP_SETCAP=true
    volumes:
      - ./vault/data:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl
    user: root
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || test $$? -eq 2 || test $$? -eq 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
    volumes:
      - ./vault/setup.sh:/vault/setup.sh:ro
      - ./vault/data:/vault/data
    entrypoint: /bin/sh
    command: -c "tr -d '\r' < /vault/setup.sh > /tmp/setup.sh && sh /tmp/setup.sh"
    restart: "no"

