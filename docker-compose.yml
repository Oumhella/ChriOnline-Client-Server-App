services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-prod
    restart: always
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - SKIP_SETCAP=true
    volumes:
      - ./vault/data:/vault/data
      - ./vault/config.hcl:/vault/config/config.hcl
    user: root
    cap_add:
      - IPC_LOCK
    command: vault server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      vault:
        condition: service_started
    environment:
      - VAULT_ADDR=http://vault:8200
    volumes:
      - ./vault/setup.sh:/vault/setup.sh:ro
      - ./vault/data:/vault/data
    entrypoint: /bin/sh
    command: /vault/setup.sh
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chrionline
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
