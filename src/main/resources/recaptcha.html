<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>reCAPTCHA Verification</title>
    <script src="https://www.google.com/recaptcha/api.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: flex-start; background-color: transparent; overflow: hidden; }
        .g-recaptcha { transform: scale(1.0); transform-origin: top center; border: 1px solid #eee; }
    </style>
    <script type="text/javascript">
        // Fonction appelée par le reCAPTCHA une fois validé
        function onCaptchaSuccess(token) {
            if (window.jsConnector) {
                try {
                    window.jsConnector.captchaResolved(token);
                    window.__captchaPending = null;
                    return;
                } catch (e) { /* ignore, file d'attente ci-dessous */ }
            }
            window.__captchaPending = token;
        }

        // Fonction appelée en cas d'expiration du captcha
        function onCaptchaExpired() {
            window.__captchaPending = null;
            if (window.jsConnector) {
                try { window.jsConnector.captchaExpired(); } catch (e) { }
            }
        }

        // Observateur de mutations pour détecter l'apparition du défi d'images Google
        window.addEventListener('DOMContentLoaded', () => {
            let wasChallengeOpen = false;
            const observer = new MutationObserver(() => {
                const iframes = document.getElementsByTagName('iframe');
                let challengeOpened = false;
                for (let i = 0; i < iframes.length; i++) {
                    const iframe = iframes[i];
                    if (iframe.src && iframe.src.includes('bframe')) {
                        let parent = iframe.parentElement;
                        while (parent && parent !== document.body) {
                            if (parent.style.visibility === 'visible' || parent.style.opacity === '1') {
                                challengeOpened = true;
                                break;
                            }
                            parent = parent.parentElement;
                        }
                    }
                }
                
                if (challengeOpened && !wasChallengeOpen) {
                    wasChallengeOpen = true;
                    if (window.jsConnector) {
                        try { window.jsConnector.showChallengePopup(); } catch(e) {}
                    }
                } else if (!challengeOpened && wasChallengeOpen) {
                    wasChallengeOpen = false;
                    if (window.jsConnector) {
                        try { window.jsConnector.hideChallengePopup(); } catch(e) {}
                    }
                }
            });
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
        });
    </script>
</head>

<body>
<!-- Le widget reCAPTCHA -->
<div class="g-recaptcha" data-sitekey="6Ld5BrssAAAAAJlHOqETrkQm5mX7A4xHmQwU7Muf" data-callback="onCaptchaSuccess"
     data-expired-callback="onCaptchaExpired">
</div>
</body>

</html>
